[project]
name = "imap-drafts-mcp"
version = "0.1.0"
description = "MCP server for IMAP mailboxes: read-only access plus drafts-only writing. It cannot send email."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Creative Partnership Srl" }]
requires-python = ">=3.10"
keywords = ["mcp", "imap", "email", "drafts", "claude", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email :: Post-Office :: IMAP",
]
dependencies = [
    "mcp>=1.2",
    # estrazione del testo dagli allegati (get_attachment_text)
    "pypdf",
    "python-docx",
    "openpyxl",
]

[project.urls]
Homepage = "https://github.com/creativepartnership/imap-drafts-mcp"
Issues = "https://github.com/creativepartnership/imap-drafts-mcp/issues"

[project.scripts]
imap-drafts-mcp = "imap_drafts_mcp.server:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv]
# senza questo, uvx da una cartella locale continua a usare la vecchia build
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
